[package]
name = "lspd_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "lspd_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
goblin = "0.9.3"
jni = "0.21"
lzma-rs = "0.3.0"
libc = "0.2"
arc-swap = "1.9.2"

[profile.release]
strip = false
debug = false
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
