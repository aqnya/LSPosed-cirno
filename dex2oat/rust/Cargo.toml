[package]
name = "dex2oat-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "preload"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "dex2oat"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.dev]
strip = false
panic = "abort"

[profile.release]
strip = false
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
